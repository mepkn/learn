<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="My notes while learning React, Svelte, Express and more." />
    <title>Learn</title>
    <script>
      // Apply the theme before first paint: saved choice, else the system's.
      try {
        const t = localStorage.getItem("theme");
        const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body class="h-full bg-background text-foreground font-sans antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
